name: Bug report
description: Something in codexswap isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
      placeholder: Ran `codexswap switch 2`, got ... — expected ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codexswap version and install method
      description: Output of `codexswap --version`, and whether you installed with uv, pipx, or from source.
      placeholder: codexswap 1.0.0, installed with uv
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Credentials are stored differently per platform, so this matters a lot.
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true
  - type: dropdown
    id: codex-code
    attributes:
      label: How do you run Codex?
      multiple: true
      options:
        - CLI (terminal)
        - VS Code extension
        - Desktop app
  - type: input
    id: codex-code-version
    attributes:
      label: Codex version
      description: Output of `codex --version`, if you know it. codexswap depends on how Codex stores its login, which changes between versions.
      placeholder: 2.1.319
  - type: textarea
    id: logs
    attributes:
      label: Command output or logs
      description: Paste the failing command's output — `codexswap list` for account-state issues, `codexswap auto` log lines for auto-switch issues. Re-running the command with `--debug` adds detail. Formatted automatically, no backticks needed. Please redact emails/account identifiers, and never paste access/refresh tokens, API keys, setup tokens, or credential-file/Keychain contents.
      render: shell
