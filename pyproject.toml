[project]
name = "codex-swap"
version = "0.1.0"
description = "Multi-account switcher for Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8,<9",
]
authors = [{name = "Onur Cetinkol", email = "onurcetinkol@gmail.com"}]
license = {text = "MIT"}
keywords = ["codex", "codex-cli", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]

[project.urls]
Homepage = "https://github.com/amiraliak99/codex-swap"
Repository = "https://github.com/amiraliak99/codex-swap"
Issues = "https://github.com/amiraliak99/codex-swap/issues"

[project.scripts]
codex-swap = "codex_swap.cli:main"
codexswap = "codex_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_swap"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto --dist loadgroup"
asyncio_default_fixture_loop_scope = "function"
